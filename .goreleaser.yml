version: 2

project_name: tablo

archives:
  - id: tablo
    ids:
      - tablo
      - tabloctl
    files:
      - LICENSE
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# brews is deprecated upstream, but it is the only GoReleaser generator of a
# Formula (as octopot/indexit and octomation/maintainer). Keep GoReleaser
# pinned in CI.
brews:
  - name: tablo
    ids: [tablo]
    # a prerelease tag (vX.Y.Z-rcN) leaves the tap as it is
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: "The one point of view to all your task boards."
    directory: Formula
    homepage: https://github.com/octopot/tablo
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "tablo"
      generate_completions_from_executable(bin/"tablo", "completion")
      bin.install "tabloctl"
      generate_completions_from_executable(bin/"tabloctl", "completion")
      prefix.install_metafiles
    test: |
      system "#{bin}/tablo", "version"
      system "#{bin}/tabloctl", "version"

builds:
  - id: tablo
    binary: tablo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/server
  - id: tabloctl
    binary: tabloctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/client

checksum: { name_template: checksums.txt }

release:
  # the repository comes from the git remote; a prerelease tag (vX.Y.Z-rcN)
  # is published as a prerelease, never as Latest
  prerelease: auto
